name: Publiceer linkpagina

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "manifest.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Haal de bestanden op
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Zet de extensieversie op de pagina
        run: |
          node --input-type=module -e '
            import {readFileSync, writeFileSync} from "node:fs";
            const {version} = JSON.parse(readFileSync("manifest.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Ongeldige extensieversie");
            const path = "website/index.html";
            const html = readFileSync(path, "utf8");
            if (!html.includes("__EXTENSION_VERSION__")) throw new Error("Versieplaceholder ontbreekt");
            writeFileSync(path, html.replaceAll("__EXTENSION_VERSION__", version));
          '
      - name: Bereid GitHub Pages voor
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Voeg de website toe
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website
      - name: Publiceer de website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
