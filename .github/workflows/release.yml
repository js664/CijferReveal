name: Publiceer stabiele release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Haal exact de releasecommit op
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Controleer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Controleer tag, versie en commit
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const m=JSON.parse(readFileSync("manifest.json","utf8")); if (`v${m.version}` !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - name: Installeer vaste dependencies
        run: npm ci
      - name: Controleer op secrets
        run: npm run check:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Bouw productie-extensie
        run: npm run build
      - name: Controleer productie-ZIP
        run: npm run validate
      - name: Installeer Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Bouw ontwikkelbuild voor de diagnosetest
        run: npm run build:dev
      - name: Browser tests
        run: npm run test:e2e
      - name: Maak en controleer releasebestanden
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/cijferreveal-release"
      - name: Publiceer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/cijferreveal-release/CijferReveal.zip#CijferReveal.zip"
          --title "CijferReveal ${GITHUB_REF_NAME#v}"
          --notes-file "$RUNNER_TEMP/cijferreveal-release/release-notes.md"
          --verify-tag --latest
